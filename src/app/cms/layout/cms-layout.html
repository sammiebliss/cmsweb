@if (mobileOpen()) {
  <button type="button" class="cms-backdrop" (click)="closeMobile()" aria-label="Close navigation"></button>
}

<div class="cms-shell" [class.nav-open]="mobileOpen()">
  <aside class="cms-sidebar" id="cms-sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">DC</span>
      <span class="brand-text">
        <strong>Digital Check</strong>
        <span>Content Hub</span>
      </span>
    </div>

    <nav aria-label="Admin">
      @for (group of nav; track group.group) {
        <div class="nav-group-label">{{ group.group }}</div>
        @for (item of group.items; track item.path) {
          <a [routerLink]="item.path" routerLinkActive="active" (click)="closeMobile()">
            <i [class]="item.icon" aria-hidden="true"></i>
            <span>{{ item.label }}</span>
          </a>
        }
      }
    </nav>

    <div class="sidebar-foot">
      <a routerLink="/" target="_blank" rel="noopener" class="site-link" (click)="closeMobile()">
        <i class="pi pi-external-link" aria-hidden="true"></i>
        View public site
      </a>
    </div>
  </aside>

  <div class="cms-main">
    <header class="cms-topbar">
      <div class="topbar-left">
        <button type="button" class="cms-menu-btn" (click)="toggleMobile()" aria-controls="cms-sidebar" [attr.aria-expanded]="mobileOpen()">
          <span class="sr-only">Toggle menu</span>
          <i class="pi" [class.pi-bars]="!mobileOpen()" [class.pi-times]="mobileOpen()" aria-hidden="true"></i>
        </button>
        <div>
          <div class="welcome">Welcome, {{ auth.user()?.name || 'Admin' }}</div>
          <div class="roles" *ngIf="auth.user()?.roles?.length">{{ auth.user()?.roles?.join(' · ') }}</div>
        </div>
      </div>
      <div class="actions">
        <a class="cms-btn cms-btn-ghost cms-btn-sm" routerLink="/" target="_blank" rel="noopener">View site</a>
        <button class="cms-btn cms-btn-brand cms-btn-sm" type="button" (click)="logout()">Logout</button>
      </div>
    </header>
    <div class="cms-content">
      <router-outlet />
    </div>
  </div>
</div>
